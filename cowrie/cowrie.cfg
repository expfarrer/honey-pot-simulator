[honeypot]
# Fake hostname shown to attackers
hostname = ubuntu-server

# Cowrie listens internally on 2222; Docker maps it to public port 2222
listen_endpoints = tcp:2222:interface=0.0.0.0

# Disable real shell — NO execution of attacker commands
backend = shell

# Fake OS version shown in SSH banner
ssh_version_string = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

# Forward events to the SetTrap ingest endpoint
[output_http]
enabled = true
url = http://app:3000/api/ingest/cowrie
# Set this to match INGEST_SECRET in your .env
# authorization = Bearer YOUR_INGEST_SECRET_HERE
